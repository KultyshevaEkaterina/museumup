<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музейный комплекс</title>
    <style>
        /* Простые стили для красивого отображения */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .exhibit {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 300px;
        }
        .exhibit img {
            width: 100%;
            border-radius: 5px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            margin: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        .admin-panel {
            background: #e8f4fc;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
</html>
